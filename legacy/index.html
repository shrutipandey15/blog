  <head>

    <meta property="og:description" content="Book reviews scored on feeling instead of stars, plus thoughts, poems and short stories." />
    <meta property="og:url" content="https://shrutipandey15.github.io/blog/" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#1b140f" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2247%22%20fill%3D%22%235b2219%22%20stroke%3D%22%23f3e7d3%22%20stroke-width%3D%225%22/%3E%3Ctext%20x%3D%2250%22%20y%3D%2268%22%20font-family%3D%22Georgia%2Cserif%22%20font-style%3D%22italic%22%20font-size%3D%2258%22%20fill%3D%22%23f3e7d3%22%20text-anchor%3D%22middle%22%3Ea%3C/text%3E%3C/svg%3E" />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Noto+Serif+Devanagari:wght@400;600&display=swap"
    />
    <style>
      :root {
        --bark: #1b140f;
        --bark-2: #2a1d15;
        --card: #5b2219;
        --accent: #b8552e;
        --gold: #e8b26a;
        --cream: #f3e7d3;
        --cream-2: #e3d2b8;
        --muted: #c9b69a;
        --paper: #efe3cc;
        --kraft: #c9a878;
        --rose: #d8b4a6;
        --sage: #8f9a78;
        --ink: #2a1a14;
        --wine: #5b2219;
        --hand: "Caveat", "Segoe Print", cursive;
        --display: "Fraunces", "Noto Serif Devanagari", Georgia, serif;
        --body: "Courier Prime", "Noto Serif Devanagari", "Courier New", ui-monospace, monospace;
        --hi: "Noto Serif Devanagari", Georgia, serif;
        --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      * { box-sizing: border-box; }
      html { background: var(--bark); scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--cream);
        font-family: var(--body);
        font-size: 15px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
        background-color: var(--bark);
        background-image:
          radial-gradient(ellipse 340px 170px at 8% 8%, rgba(150, 72, 36, 0.26), transparent 70%),
          radial-gradient(ellipse 280px 220px at 92% 18%, rgba(120, 58, 30, 0.24), transparent 70%),
          radial-gradient(ellipse 380px 180px at 22% 42%, rgba(92, 52, 30, 0.3), transparent 70%),
          radial-gradient(ellipse 300px 260px at 86% 62%, rgba(140, 66, 32, 0.2), transparent 70%),
          radial-gradient(ellipse 360px 170px at 14% 84%, rgba(110, 60, 34, 0.26), transparent 70%);
        background-attachment: fixed;
      }
      a { color: inherit; text-decoration: none; }
      :focus-visible { outline: 2px dashed var(--gold); outline-offset: 3px; border-radius: 6px; }
      .wrap { max-width: 1080px; margin: 0 auto; padding: 0 18px; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .skip { position: absolute; left: 12px; top: -60px; z-index: 50; padding: 10px 14px; background: var(--cream); color: var(--ink); border-radius: 8px; font-weight: 700; }
      .skip:focus { top: 12px; }

      /* ---------- motion ---------- */
      @keyframes twinkle { 0%, 100% { opacity: 0.35; scale: 0.85; } 50% { opacity: 1; scale: 1.1; } }
      @keyframes bob { 0%, 100% { translate: 0 0; rotate: -6deg; } 50% { translate: 0 -5px; rotate: -2deg; } }
      @keyframes rise { from { opacity: 0; translate: 0 16px; } to { opacity: 1; translate: 0 0; } }
      @keyframes draw { from { stroke-dashoffset: 420; } to { stroke-dashoffset: 0; } }
      @keyframes grow { from { scale: 0 1; } to { scale: 1 1; } }
      @keyframes bookin { from { opacity: 0; rotate: y -38deg; } to { opacity: 1; rotate: y 0deg; } }
      @keyframes shimmer { 0%, 72% { background-position: 110% 0; } 100% { background-position: -60% 0; } }
      @keyframes halo { 0%, 100% { box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45), 0 0 0 0 rgba(232, 178, 106, 0); } 50% { box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45), 0 0 26px 6px rgba(232, 178, 106, 0.28); } }
      @keyframes flicker { 0%, 100% { scale: 1 1; opacity: 0.95; } 30% { scale: 0.9 1.1; } 55% { scale: 1.06 0.94; opacity: 0.8; } 80% { scale: 0.96 1.05; } }
      @keyframes swing { 0% { rotate: 0deg; } 30% { rotate: 9deg; } 60% { rotate: -6deg; } 100% { rotate: 0deg; } }
      @keyframes wobble { 0%, 100% { rotate: -12deg; } 25% { rotate: -22deg; } 60% { rotate: -5deg; } }
      @keyframes glow { 0%, 100% { opacity: 0; } 45%, 60% { opacity: 0.9; } }
      @keyframes driftA { 0%, 100% { translate: 0 0; } 25% { translate: 18px -28px; } 50% { translate: -14px -58px; } 75% { translate: 12px -30px; } }
      @keyframes driftB { 0%, 100% { translate: 0 0; } 33% { translate: -22px -18px; } 66% { translate: 10px -46px; } }
      @keyframes fall {
        0% { translate: 0 -40px; rotate: 0deg; opacity: 0; }
        8% { opacity: 0.75; }
        25% { translate: 34px 25vh; rotate: 90deg; }
        50% { translate: -12px 50vh; rotate: 170deg; }
        75% { translate: 30px 75vh; rotate: 260deg; }
        92% { opacity: 0.75; }
        100% { translate: -6px 105vh; rotate: 340deg; opacity: 0; }
      }
      .twinkle { animation: twinkle 3.2s ease-in-out infinite; }
      .twinkle-slow { animation: twinkle 5s ease-in-out infinite; }
      .bob { animation: bob 4s ease-in-out infinite; }
      .rise { animation: rise 0.7s var(--ease) backwards; }
      .reveal, .home > section, .pair > section { animation: rise 0.8s var(--ease) backwards; }
      @supports (animation-timeline: view()) {
        .reveal, .home > section, .pair > section {
          animation-timeline: view();
          animation-range: entry 0% entry 40%;
          animation-duration: auto;
        }
      }
      .squig { display: block; overflow: visible; }
      .squig path { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 420; animation: draw 1.4s 0.25s ease-out backwards; }
      .shimmer {
        color: transparent;
        background: linear-gradient(100deg, var(--cream) 42%, #fff4dc 49%, #f6c98a 51%, var(--cream) 58%);
        background-size: 260% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        animation: shimmer 7s ease-in-out 1s infinite;
      }
      .flicker { transform-box: fill-box; transform-origin: center bottom; animation: flicker 2.2s ease-in-out infinite; }
      .lift { transition: translate 0.25s ease, scale 0.15s ease, box-shadow 0.25s ease; }
      .lift:hover { translate: 0 -4px; }
      .lift:active, .btn:active, .chip:active { scale: 0.97; }

      .sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
      .firefly { position: absolute; width: 5px; height: 5px; border-radius: 999px; background: #ffdf9e; box-shadow: 0 0 8px 3px rgba(255, 196, 104, 0.55); opacity: 0; }
      .ff1 { left: 12%; top: 22%; animation: driftA 15s ease-in-out infinite, glow 4s ease-in-out infinite; }
      .ff2 { left: 84%; top: 36%; animation: driftB 12s ease-in-out infinite, glow 5s ease-in-out 1.3s infinite; }
      .ff3 { left: 26%; top: 62%; animation: driftB 17s ease-in-out infinite, glow 4.4s ease-in-out 2.6s infinite; }
      .ff4 { left: 70%; top: 78%; animation: driftA 13s ease-in-out infinite, glow 3.8s ease-in-out 0.7s infinite; }
      .ff5 { left: 48%; top: 92%; animation: driftA 19s ease-in-out infinite, glow 5.5s ease-in-out 3.4s infinite; }
      .leaf { position: absolute; top: 0; width: 16px; height: 24px; opacity: 0; }
      .lf1 { left: 18%; animation: fall 24s linear 2s infinite; }
      .lf2 { left: 76%; animation: fall 28s linear 14s infinite; }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { animation: none !important; transition: none !important; }
        .shimmer { color: var(--cream); background: none; }
        .sky { display: none; }
      }

      /* ---------- hero ---------- */
      .collage {
        height: 176px;
        overflow: hidden;
        display: grid;
        grid-template-rows: repeat(2, minmax(0, 1fr));
        grid-auto-flow: column;
        grid-auto-columns: minmax(118px, 1fr);
        gap: 8px;
        padding: 14px 10px 22px;
        background: var(--bark-2);
      }
      .scrap { position: relative; overflow: hidden; padding: 12px 10px 10px; color: var(--ink); line-height: 1.1; }
      .scrap .tape { top: -8px; width: 46px; height: 16px; }
      .s-hand { font-family: var(--hand); font-size: 22px; line-height: 1; }
      .s-serif { font-family: var(--display); font-style: italic; font-size: 15px; }
      .s-small { font-size: 11px; letter-spacing: 0.06em; display: flex; align-items: flex-end; }
      .scallop { display: block; width: 100%; height: 16px; margin-top: -1px; }
      .brand { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: -66px; padding: 0 18px; text-align: center; }
      .mono { position: relative; width: 112px; height: 112px; }
      .mono .ring { width: 112px; height: 112px; border-radius: 999px; background: var(--card); border: 3px solid var(--cream); padding: 6px; animation: halo 4.5s ease-in-out infinite; }
      .mono .ring span { width: 100%; height: 100%; border-radius: 999px; border: 1.5px dashed rgba(243, 231, 211, 0.6); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-style: italic; font-size: 56px; line-height: 1; padding-bottom: 8px; }
      .mono svg { position: absolute; }
      .wordmark { margin: 4px 0 0; font-family: var(--display); font-style: italic; font-weight: 400; font-size: clamp(54px, 9vw, 88px); line-height: 1; }
      .tagline { margin: 0; font-family: var(--hand); font-size: clamp(26px, 3vw, 30px); line-height: 1.1; rotate: -2deg; }
      .icons { display: flex; gap: 6px; }
      .icons a { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; }
      .icons a:hover { background: rgba(243, 231, 211, 0.08); }
      .mini-brand { display: flex; justify-content: center; padding: 18px 18px 0; }
      .mini-brand a { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
      .mini-brand .m { width: 44px; height: 44px; border-radius: 999px; background: var(--card); border: 2px solid var(--cream); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-style: italic; font-size: 24px; line-height: 1; padding-bottom: 4px; }
      .mini-brand .w { font-family: var(--display); font-style: italic; font-size: 34px; line-height: 1; }

      /* ---------- tabs ---------- */
      .tabs { position: sticky; top: 0; z-index: 10; background: rgba(27, 20, 15, 0.92); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
      .tabs ul { list-style: none; margin: 0 auto; padding: 10px 8px; display: flex; gap: 2px; justify-content: center; }
      .tabs a { height: 44px; padding: 0 13px; display: flex; align-items: center; border-radius: 12px; border: 1.5px solid transparent; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; transition: border-color 0.2s ease; }
      .tabs a:hover { border-color: rgba(243, 231, 211, 0.35); }
      .tabs a[aria-current="page"] { background: var(--card); border-color: var(--cream); }

      /* ---------- shared pieces ---------- */
      main { padding-bottom: 8px; }
      .box { position: relative; background: var(--card); border: 1.5px solid var(--cream); border-radius: 16px; }
      .tape { position: absolute; display: block; height: 22px; width: 80px; top: -10px; rotate: -4deg; background: rgba(216, 180, 166, 0.82); }
      .hd { display: flex; flex-direction: column; align-items: center; text-align: center; }
      .hand { margin: 0; font-family: var(--hand); font-weight: 700; font-size: 36px; line-height: 1; }
      .hand.xl { font-size: 46px; }
      .note { margin: 4px 0 0; font-family: var(--hand); font-size: 20px; line-height: 1.15; color: var(--gold); rotate: 2deg; }
      .note.l { rotate: -2deg; }
      .center { text-align: center; justify-content: center; }
      .btn { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 14px; background: var(--card); border: 1.5px solid var(--cream); font-size: 13px; font-weight: 700; transition: scale 0.15s ease, background 0.2s ease; }
      .btn:hover { background: #6a2a1f; }
      .btn.cream { background: var(--cream); color: var(--ink); border-color: var(--cream); border-radius: 999px; font-size: 14px; }
      .btn.cream:hover { background: #fff6e6; }
      .seal { width: 50px; height: 50px; flex-shrink: 0; border-radius: 999px; background: var(--accent); box-shadow: inset 0 0 0 4px rgba(0, 0, 0, 0.18), 0 2px 6px rgba(0, 0, 0, 0.35); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-style: italic; font-size: 26px; padding-bottom: 4px; rotate: -12deg; }
      .seal:hover { animation: wobble 0.8s ease-in-out; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
      .empty { text-align: center; font-family: var(--hand); font-size: 24px; color: var(--cream-2); }

      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip { min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; background: rgba(0, 0, 0, 0.22); border: 1.5px solid var(--c, var(--cream)); font-size: 13px; font-weight: 700; transition: scale 0.15s ease, background 0.2s ease; }
      .chip:hover { background: rgba(0, 0, 0, 0.36); }
      .chip .n { font-weight: 400; color: var(--cream-2); }
      .chip[aria-current="true"] { background: var(--cream); color: var(--ink); border-color: var(--cream); }
      .chip[aria-current="true"] .n { color: #6b5a4c; }
      .chip.small { min-height: 40px; padding: 0 12px; font-size: 12px; }

      /* review cards */
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
      .rcard { display: flex; flex-direction: column; background: var(--card); border: 1.5px solid var(--cream); border-radius: 14px; overflow: hidden; rotate: var(--tilt, 0deg); }
      .rcard:hover { box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45), 0 0 18px rgba(232, 178, 106, 0.18); }
      .cover { position: relative; display: flex; flex-direction: column; gap: 8px; height: 190px; padding: 10px; }
      .frame { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; border: 1px solid rgba(243, 231, 211, 0.4); padding: 12px 14px 10px 10px; }
      .ct { font-family: var(--display); font-weight: 600; font-size: 27px; line-height: 1.05; }
      .ct.sm { font-size: 21px; }
      .ca { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
      .band { display: flex; gap: 2px; height: 6px; border-radius: 999px; overflow: hidden; }
      .band i { display: block; }
      .ribbon { position: absolute; top: 0; right: 4px; width: 14px; height: 44px; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%); transform-origin: top center; }
      .rcard:hover .ribbon { animation: swing 1.1s ease-in-out; }
      .rbody { display: flex; flex-direction: column; gap: 7px; padding: 12px 12px 14px; flex-grow: 1; }
      .rt { font-size: 13px; font-weight: 700; line-height: 1.3; }
      .rm { font-size: 11px; color: var(--cream-2); }
      .minis { display: flex; flex-wrap: wrap; gap: 4px; }
      .mini { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border: 1px solid rgba(243, 231, 211, 0.5); border-radius: 999px; font-size: 10px; }
      .mini .dot { width: 7px; height: 7px; }

      /* notebook slips */
      .slips { display: grid; gap: 24px; padding-top: 8px; }
      .slip { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 22px 18px 16px; border-radius: 3px; color: var(--ink); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35); rotate: var(--tilt, 0deg); }
      .slip:hover { box-shadow: 0 12px 26px rgba(0, 0, 0, 0.45); }
      .slip .tape { width: 64px; height: 20px; top: -9px; rotate: -5deg; }
      .sf { font-family: var(--hand); font-size: 20px; line-height: 1; color: var(--wine); }
      .st { font-family: var(--display); font-size: 20px; font-weight: 600; line-height: 1.2; }
      .sx { font-size: 13px; line-height: 1.5; color: #4a3a30; }

      /* ---------- home ---------- */
      .home { display: flex; flex-direction: column; gap: 40px; padding-top: 16px; }
      .home > section, .pair > section { display: flex; flex-direction: column; gap: 16px; }
      .letter { padding: 30px 22px 22px; rotate: -1deg; max-width: 640px; width: 100%; margin: 0 auto; text-align: center; gap: 12px; }
      .letter .tape { left: 50%; margin-left: -46px; width: 92px; height: 24px; top: -11px; rotate: -3deg; }
      .letter p { margin: 0; font-size: 14px; line-height: 1.65; }
      .letter .row { display: flex; align-items: center; justify-content: center; gap: 16px; }
      .handlink { min-height: 44px; display: inline-flex; align-items: center; font-family: var(--hand); font-size: 23px; color: var(--gold); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
      .pair { display: grid; gap: 40px; }
      .night { display: flex; gap: 16px; align-items: center; padding: 18px 16px 16px; rotate: 1deg; }
      .night .label { position: absolute; top: -16px; right: 14px; padding: 2px 10px; background: var(--paper); font-family: var(--hand); font-size: 19px; color: var(--ink); rotate: 4deg; }
      .mini-cover { width: 76px; height: 114px; flex-shrink: 0; border-radius: 4px; padding: 6px; background: #2d3438; display: flex; }
      .mini-cover span { flex-grow: 1; border: 1px solid rgba(243, 231, 211, 0.4); padding: 6px; font-family: var(--display); font-size: 12px; line-height: 1.15; }
      .night .info { flex-grow: 1; display: flex; flex-direction: column; gap: 6px; }
      .night .b { font-family: var(--display); font-size: 19px; line-height: 1.15; }
      .night .a, .night .p { font-size: 12px; color: var(--cream-2); }
      .bar { height: 8px; border-radius: 999px; background: rgba(0, 0, 0, 0.3); overflow: hidden; margin-top: 4px; }
      .bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transform-origin: left center; animation: grow 1.2s var(--ease) 0.4s backwards; }
      .feelbox { padding: 18px 14px; justify-content: center; }
      .rate { padding: 20px 18px; display: flex; flex-direction: column; gap: 16px; }
      .rate p { margin: 0; font-size: 14px; line-height: 1.65; text-align: center; }
      .key { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
      .key li { display: flex; align-items: center; gap: 8px; font-size: 13px; }
      .key .sw { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
      .quote { position: relative; margin: 8px 4px 0; padding: 30px 22px 24px; background: var(--paper); color: var(--ink); border-radius: 4px; text-align: center; rotate: 1.5deg; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); justify-content: center; }
      .quote .t1 { left: 24px; width: 70px; background: rgba(184, 85, 46, 0.7); rotate: -8deg; }
      .quote .t2 { right: 24px; left: auto; width: 70px; background: rgba(143, 154, 120, 0.8); rotate: 7deg; }
      .qm { font-family: var(--display); font-size: 64px; line-height: 0.6; color: var(--accent); }
      .quote blockquote { margin: 0; font-family: var(--display); font-style: italic; font-size: 21px; line-height: 1.35; }
      .quote cite { font-style: normal; font-family: var(--hand); font-size: 22px; color: var(--wine); }

        const newer = list[i - 1];
        const older = list[i + 1];
        const title = (x) => (x.cat === "Reviews" ? x.book : x.t);
        const kind = isR ? "review" : String(p.form || "").toLowerCase();
        return (
          '<article class="post">' +
          '<a class="back" href="' + (isR ? "#/reviews" : "#/notebook") + '">back to ' + (isR ? "reviews" : "the notebook") + "</a>" +
          (isR
            ? '<div class="bigcover" style="background:' + coverBg(p) + '" aria-hidden="true"><span class="ribbon"></span>' +
              '<span class="frame"><span class="ct">' + esc(p.book) + '</span><span class="ca">' + esc(p.author) + "</span></span>" + band(p) + "</div>"
            : "") +
          '<header class="ptitle rise" style="animation-delay:250ms">' +
          '<p class="note">' + esc(kind) + " · " + fmtFull(p.date) + " · " + rtime(p) + " min read</p>" +
          "<h1>" + esc(p.t) + "</h1>" +
          (isR ? '<p class="byline">' + esc(p.book) + " by " + esc(p.author) + "</p>" : "") +
          (p.ex ? '<p class="dek">' + esc(p.ex) + "</p>" : "") +
          "</header>" +
          (isR && p.emo.length
            ? '<div class="box meter"><h2 class="hand">what showed up, and how loud</h2>' +
              p.emo.filter(([e]) => EMO[e]).map(([e, n], k) =>
                '<a class="mrow" href="#/reviews/feel/' + enc(e) + '" aria-label="' + esc(e) + ", " + n + " out of 5. More books that left " + esc(e) + '">' +
                '<span class="mn">' + esc(e) + '</span><span class="track"><i style="width:' + n * 20 + "%;background:" + EMO[e] + ";animation-delay:" + (450 + k * 150) + 'ms"></i></span>' +
                '<span class="mv">' + n + "/5</span></a>"
              ).join("") + "</div>"
            : "") +
          '<div class="prose" style="--tint:' + tint(p) + '">' + p.body.map(block).join("") + "</div>" +
          (p.verdict ? '<div class="verdict reveal"><span class="tape" aria-hidden="true"></span><h2 class="hand">the aftertaste</h2><p>' + esc(p.verdict) + "</p></div>" : "") +
          (p.ask
            ? '<div class="ask reveal"><h2 class="hand">over to you</h2><p>' + esc(p.ask) + '</p><a href="mailto:' + MAIL + "?subject=" + enc("Re: " + title(p)) + '">No comment box. Email me.</a></div>'
            : "") +
          (p.tags && p.tags.length ? '<div class="ptags">' + p.tags.map((t) => '<a class="ptag" href="#/tag/' + enc(t) + '">#' + esc(t) + "</a>").join("") + "</div>" : "") +
          '<div class="rel"><h2 class="hand">' + (isR ? "if this one did it for you" : "more from the notebook") + "</h2>" + related(p) + "</div>" +
          '<nav class="pn" aria-label="More posts">' +
          (newer ? '<a href="#/post/' + enc(newer.id) + '"><small>newer</small><b>' + esc(title(newer)) + "</b></a>" : "") +
          (older ? '<a class="older" href="#/post/' + enc(older.id) + '"><small>older</small><b>' + esc(title(older)) + "</b></a>" : "") +
          "</nav></article>"
        );
      }

      function aboutPage() {
        return (
          '<div class="rise" style="padding-top:28px"><article class="box about"><span class="tape" aria-hidden="true"></span>' +
          '<p class="note center" style="rotate:0deg;margin:0">about, briefly</p>' +
          "<h1>Books are just where I go.</h1>" +
          '<p class="lede">This isn\'t a book review blog.</p>' +
          "<p>I read the way other people drink, or run, or reorganise a cupboard at two in the morning. Something in the day is unbearable, and there's a book, and for a while I'm not here.</p>" +
          "<p>Then something in the book says a thing, and I have a reaction completely out of proportion to what just happened, and it turns out the reaction was already in the room. It had been waiting. The book only opened a door.</p>" +
          '<div class="two"><a class="lift" href="#/reviews"><span class="hand">Reviews</span><span>No plot section, no pros and cons.</span></a>' +
          '<a class="lift" href="#/notebook"><span class="hand">Notebook</span><span>Thoughts, poems, the odd story.</span></a></div>' +
          "<p>I'm going to be wrong about books you love, and I'm not doing it to be difficult. I just don't have any diplomacy left over for fiction at the end of a day.</p>" +
          '<p class="pullq">If a post is only clever, it doesn\'t go up. Clever is easy. Clever is what I do all day.</p>' +
          '<h2 class="hand">The rating thing</h2>' +
          "<p>Stars don't work and I've stopped pretending. Three stars can mean bored, or it can mean wrecked and annoyed about being wrecked, and those are not the same afternoon.</p>" +
          "<p>So every review gets scored on what actually turned up and how loud it was. A book can be a five on rage and still be the best thing that happened that month.</p>" +
          '<h2 class="hand">The thing I built</h2>' +
          '<p>At some point I got annoyed enough at star ratings to go and build an alternative, which is an unhinged response to a small problem and I stand by it. It\'s called <a class="inl" href="https://bibliome.app" rel="noopener noreferrer">Bibliome</a>. You log what a book did to you instead of scoring it, and after a while it draws you a picture of your own reading that you may not enjoy.</p>' +
          "<p>You don't have to use it. I'd notice. I wouldn't say anything.</p>" +
          '<div class="ask"><h2 class="hand">No comment box. That\'s deliberate.</h2>' +
          '<p style="font-size:14px">If you want to argue, <a class="inl" href="mailto:' + MAIL + '">email me</a>. One person who actually types something out beats fifty who don\'t. I read all of them. I answer most.</p></div>' +
          "</article></div>"
        );
      }

      function tagPage(tag) {
        const list = LIVE.filter((p) => p.tags.includes(tag));
        return (
          '<div class="page rise"><div class="phead">' + heading("#" + tag, list.length + (list.length === 1 ? " post" : " posts"), "h1") + "</div>" +
          listMixed(list) + '<a class="btn" href="#/tags" style="align-self:center">All tags</a></div>'
        );
      }

      function tagsPage() {
        const m = {};
        LIVE.forEach((p) => p.tags.forEach((t) => (m[t] = (m[t] || 0) + 1)));
        const tags = Object.keys(m).sort((a, b) => m[b] - m[a] || a.localeCompare(b));
        return (
          '<div class="page rise"><div class="phead">' + heading("Tags", "authors, moods, themes and the occasional grudge", "h1") + "</div>" +
          '<div class="chips tagcloud">' + tags.map((t) => '<a class="chip small" href="#/tag/' + enc(t) + '">#' + esc(t) + ' <span class="n">' + m[t] + "</span></a>").join("") + "</div></div>"
        );
      }

      function listMixed(list) {
        const r = list.filter((p) => p.cat === "Reviews");
        const n = list.filter((p) => p.cat !== "Reviews");
        return (
          (r.length ? '<div class="grid">' + r.map(rcard).join("") + "</div>" : "") +
          (n.length ? '<div class="slips">' + n.map((p, i) => slip(p, i, true)).join("") + "</div>" : "") +
          (list.length ? "" : '<p class="empty">Nothing here yet.</p>')
        );
      }

      function searchPage(term) {
        const q = term.toLowerCase().trim();
        const hay = (p) => [p.t, p.ex, p.book, p.author, p.verdict, p.tags.join(" "), p.emo.map(([e]) => e).join(" "), p.body.map((b) => b[1]).join(" ")].join(" ").toLowerCase();
        const list = q ? LIVE.filter((p) => hay(p).includes(q)) : [];
        return (
          '<div class="page rise"><div class="phead">' + heading("Search", q ? list.length + (list.length === 1 ? " match" : " matches") + " for " + term : "type something below", "h1") + "</div>" +
          (q ? listMixed(list) : "") + "</div>"
        );
      }

      function notFound() {
        return (
          '<div class="page rise"><div class="phead">' + heading("Not here", null, "h1") +
          "<p>Wrong link, or I deleted it, or I never wrote it. All three have happened and I'm not going to tell you which.</p></div>" +
          '<a class="btn" href="#/" style="align-self:center">Go to the front page</a></div>'
        );
      }

      /* ---------- head tags ---------- */
      function setHead(title, desc, path) {
        document.title = title;
        const set = (sel, attr, val) => { const el = document.querySelector(sel); if (el) el.setAttribute(attr, val); };
        set('meta[name="description"]', "content", desc);
        set('meta[property="og:title"]', "content", title);
        set('meta[property="og:description"]', "content", desc);
        set('meta[property="og:url"]', "content", SITE + "/" + path);
        set('meta[property="og:type"]', "content", path.startsWith("#/post/") ? "article" : "website");
      }

      /* ---------- router ---------- */
      const scrollMemory = {};
      let lastHash = null;

      function render() {
        const raw = location.hash.replace(/^#/, "") || "/";
        let h = raw.split("/").filter(Boolean).map((s) => { try { return decodeURIComponent(s); } catch (e) { return s; } });
        if (h.length >= 2 && h[h.length - 2] === "page") h = h.slice(0, -2); // old paginated links

        // retired pages from the old site
        if (h[0] === "log") { location.replace("#/"); return; }
        if (h[0] === "index" || h[0] === "archive") { location.replace("#/reviews"); return; }

        let out, section = null, big = false;
        let head = ["Aftertaste — a book blog about what books do to you", "Book reviews scored on feeling instead of stars, plus thoughts, poems and short stories."];

        if (!h.length) { out = home(); section = "home"; big = true; }
        else if (h[0] === "reviews") {
          const feel = h[1] === "feel" && EMO[h[2]] ? h[2] : null;
          out = reviewsPage(feel); section = "reviews";
          head = [(feel ? "Books that left " + feel + " — " : "Book reviews without star ratings — ") + "Aftertaste", "Reviews that record what a book actually did to you: recognition, rage, grief, comfort. No pros and cons, no plot summary."];
        } else if (h[0] === "notebook") {
          out = notebookPage(h[1] || null); section = "notebook";
          head = ["Notebook — essays, poems and short stories about reading", "Arguments about books, poems written too late at night, and the occasional short story."];
        } else if (h[0] === "about") {
          out = aboutPage(); section = "about";
          head = ["About — Aftertaste", "Books are just where I go. Why this blog scores feelings instead of stars."];
        } else if (h[0] === "post") {
          const p = LIVE.find((x) => x.id === h[1]);
          if (p) {
            out = postPage(p); section = p.cat === "Reviews" ? "reviews" : "notebook";
            head = [(p.cat === "Reviews" ? p.book + " by " + p.author + " — " + p.t : p.t) + " — Aftertaste", p.ex || p.t];
          } else out = notFound();
        } else if (h[0] === "tag" && h[1]) {
          out = tagPage(h[1]);
          head = ["#" + h[1] + " — Aftertaste", "Everything on Aftertaste tagged " + h[1] + "."];
        } else if (h[0] === "tags") {
          out = tagsPage();
          head = ["Tags — Aftertaste", "Every tag across the blog: authors, moods, themes and the occasional grudge."];
        } else if (h[0] === "search") {
          const term = h.slice(1).join("/");
          out = searchPage(term);
          document.getElementById("q").value = term;
          head = ["Search — Aftertaste", "Search the reviews and the notebook."];
        } else out = notFound();

        document.getElementById("top").innerHTML = big ? heroBig() : heroSmall();
        document.getElementById("tabs").innerHTML = tabs(section);
        document.getElementById("app").innerHTML = out;
        document.getElementById("app").dataset.ok = "1";
        setHead(head[0], head[1], "#/" + h.map(enc).join("/"));

        // scroll: new posts start at the top; lists remember where you were
        const cameFromPost = lastHash && lastHash.startsWith("#/post/");
        const key = location.hash || "#/";
        if (cameFromPost && scrollMemory[key] != null && h[0] !== "post") window.scrollTo(0, scrollMemory[key]);
        else if (lastHash !== null) window.scrollTo(0, 0);
        lastHash = key;
      }

      addEventListener("hashchange", (e) => {
        const old = new URL(e.oldURL).hash || "#/";
        scrollMemory[old] = window.scrollY;
        render();
        if (location.hash.startsWith("#/post/")) document.getElementById("app").focus({ preventScroll: true });
      });

      document.getElementById("q").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const v = e.target.value.trim();
          location.hash = v ? "#/search/" + enc(v) : "#/";
        }
      });

      try {
        render();
      } catch (err) {
        document.getElementById("app").innerHTML =
          '<div class="page"><div class="phead"><h1 class="hand">This page could not be built</h1><p>' + esc(err.message) +
          "</p><p>Almost always a missing comma or an unclosed quote in the block you last edited. Undo that commit and try again.</p></div></div>";
        console.error(err);
      }
    </script>
  </body>
</html>
